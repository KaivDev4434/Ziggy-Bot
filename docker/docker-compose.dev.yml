services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend.dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - companion-network

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend.dev
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app
      - /app/node_modules
      - /app/dist
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGODB_URI=mongodb://database:27017/companion_dev
      - REDIS_URL=redis://redis:6379
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - OLLAMA_BASE_URL=http://local-llm:11434
    depends_on:
      - database
      - redis
      - local-llm
    networks:
      - companion-network

  database:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=companion_dev
    networks:
      - companion-network

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - companion-network

  local-llm:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - companion-network

volumes:
  mongodb_data:
  redis_data:
  ollama_models:

networks:
  companion-network:
    driver: bridge 