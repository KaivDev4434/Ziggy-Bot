name: Test Suite & Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://root:example@localhost:27017/test_db?authSource=admin
        JWT_SECRET: test-jwt-secret-for-ci
        JWT_EXPIRES_IN: 1h

    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://root:example@localhost:27017/test_db?authSource=admin
        JWT_SECRET: test-jwt-secret-for-ci
        JWT_EXPIRES_IN: 1h

    - name: Generate test coverage
      run: npm run test:coverage
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://root:example@localhost:27017/test_db?authSource=admin
        JWT_SECRET: test-jwt-secret-for-ci
        JWT_EXPIRES_IN: 1h

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./coverage/
        fail_ci_if_error: true

    - name: Build application
      run: npm run build

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run performance tests
      run: |
        npm run build
        timeout 30s npm start &
        sleep 10
        node test-nlp.js || true
      env:
        NODE_ENV: production
        MONGODB_URI: mongodb://root:example@localhost:27017/perf_test_db?authSource=admin
        JWT_SECRET: test-jwt-secret-for-performance
        JWT_EXPIRES_IN: 1h
        PORT: 3001

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Check for known vulnerabilities
      run: npx better-npm-audit audit --level moderate

  quality-gate:
    runs-on: ubuntu-latest
    needs: [test, performance-test, security-scan]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Quality Gate Check
      run: |
        echo "✅ All tests passed"
        echo "✅ Performance tests completed"
        echo "✅ Security scans passed"
        echo "🎉 Quality gate: PASSED" 